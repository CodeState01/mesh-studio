<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src *; img-src * data: blob:; media-src * blob: data:" />
  <title>Mesh</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="boot"><svg class="boot-mark" viewBox="0 0 32 32" fill="none"><path d="M12.6 13.6L19.4 13.6L19.4 19.6L12.6 19.6Z" fill="#b9f23c" opacity=".3"/><path d="M7 9L13 7.6L19 7.6L25 9M6 14.6L12.6 13.6L19.4 13.6L26 14.6M6 20.2L12.6 19.6L19.4 19.6L26 20.2M7 25.6L13 26.2L19 26.2L25 25.6M7 9L6 14.6L6 20.2L7 25.6M13 7.6L12.6 13.6L12.6 19.6L13 26.2M19 7.6L19.4 13.6L19.4 19.6L19 26.2M25 9L26 14.6L26 20.2L25 25.6" stroke="#e8e8e3" stroke-width="1.4" stroke-linejoin="round" opacity=".85"/><circle cx="7" cy="9" r="1.35" fill="#e8e8e3"/><circle cx="13" cy="7.6" r="1.35" fill="#e8e8e3"/><circle cx="19" cy="7.6" r="1.35" fill="#e8e8e3"/><circle cx="25" cy="9" r="1.35" fill="#e8e8e3"/><circle cx="6" cy="14.6" r="1.35" fill="#e8e8e3"/><circle cx="12.6" cy="13.6" r="1.35" fill="#e8e8e3"/><circle cx="19.4" cy="13.6" r="1.35" fill="#e8e8e3"/><circle cx="26" cy="14.6" r="1.35" fill="#e8e8e3"/><circle cx="6" cy="20.2" r="1.35" fill="#e8e8e3"/><circle cx="12.6" cy="19.6" r="1.35" fill="#e8e8e3"/><circle cx="19.4" cy="19.6" r="1.35" fill="#e8e8e3"/><circle cx="26" cy="20.2" r="1.35" fill="#e8e8e3"/><circle cx="7" cy="25.6" r="1.35" fill="#e8e8e3"/><circle cx="13" cy="26.2" r="1.35" fill="#e8e8e3"/><circle cx="19" cy="26.2" r="1.35" fill="#e8e8e3"/><circle cx="25" cy="25.6" r="1.35" fill="#e8e8e3"/><circle cx="19.4" cy="13.6" r="2.5" fill="#b9f23c"/></svg></div>

  <div id="app">
    <!-- O viewport ocupa a tela inteira; todo o resto flutua por cima -->
    <div id="viewport">
      <div class="vp-hint" id="vp-hint"></div>
      <div class="vp-cam-badge" id="cam-badge"></div>
    </div>

    <header id="topbar">
      <div class="tb-left">
        <button class="brand" id="brand" title="Menu do app"></button>
        <div class="crumb" id="crumb"></div>
      </div>
      <nav class="ws-pills float" id="workspaces"></nav>
      <div class="tb-right">
        <button class="search-pill float" id="search-pill"></button>
        <div class="status" id="tb-status"></div>
      </div>
    </header>

    <div id="precision-bar" class="float"></div>

    <aside id="left-panel" class="float panel">
      <div class="panel-h"><div class="seg sm" id="mode-seg"></div><div class="panel-actions" id="outliner-actions"></div></div>
      <div id="outliner"></div>
    </aside>

    <aside id="right-panel" class="float panel">
      <div class="tabs icons" id="prop-tabs"></div>
      <div id="props"></div>
    </aside>

    <div id="view-tools" class="float">
      <div class="seg sm vertical" id="shading-seg"></div>
    </div>

    <div id="tool-dock" class="float"></div>
    <div id="op-panel" class="float"></div>

    <section id="bottom" class="float">
      <div class="bt-bar" id="bt-bar"></div>
      <div id="timeline"></div>
    </section>

    <aside id="ai" class="float panel">
      <div class="panel-h ai-h"><span class="ai-title"></span><div class="panel-actions" id="ai-actions"></div></div>
      <div class="ai-provider" id="ai-provider"></div>
      <div id="ai-log"></div>
      <form id="ai-form">
        <textarea id="ai-input" rows="2" placeholder="Descreva o que criar…"></textarea>
        <div class="ai-form-bar">
          <span class="ai-cursors-ctl" id="ai-cursors-ctl"></span>
          <button type="submit" class="btn primary sm" id="ai-send"></button>
        </div>
      </form>
    </aside>

    <!-- Páginas (Início, Loja, Código, Engines, Comandos, Ajustes) abrem como uma "folha" flutuante -->
    <div id="sheet">
      <div class="sheet-card">
        <div class="sheet-h"><div class="sheet-title" id="sheet-title"></div><button class="icon-btn" id="sheet-close" title="Fechar (Esc)"></button></div>
        <div id="page"></div>
      </div>
    </div>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
