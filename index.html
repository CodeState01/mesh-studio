<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src *; img-src * data: blob:; media-src * blob: data:" />
  <title>Argila Studio</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="boot"><div class="boot-mark"></div></div>

  <div id="app">
    <!-- O viewport ocupa a tela inteira; todo o resto flutua por cima -->
    <div id="viewport">
      <div class="vp-hint" id="vp-hint"></div>
      <div class="vp-cam-badge" id="cam-badge"></div>
    </div>

    <header id="topbar">
      <div class="tb-left">
        <button class="brand" id="brand" title="Menu do app"></button>
        <div class="crumb" id="crumb"></div>
      </div>
      <nav class="ws-pills float" id="workspaces"></nav>
      <div class="tb-right">
        <button class="search-pill float" id="search-pill"></button>
        <div class="status" id="tb-status"></div>
      </div>
    </header>

    <div id="precision-bar" class="float"></div>

    <aside id="left-panel" class="float panel">
      <div class="panel-h"><div class="seg sm" id="mode-seg"></div><div class="panel-actions" id="outliner-actions"></div></div>
      <div id="outliner"></div>
    </aside>

    <aside id="right-panel" class="float panel">
      <div class="tabs icons" id="prop-tabs"></div>
      <div id="props"></div>
    </aside>

    <div id="view-tools" class="float">
      <div class="seg sm vertical" id="shading-seg"></div>
    </div>

    <div id="tool-dock" class="float"></div>
    <div id="op-panel" class="float"></div>

    <section id="bottom" class="float">
      <div class="bt-bar" id="bt-bar"></div>
      <div id="timeline"></div>
    </section>

    <aside id="ai" class="float panel">
      <div class="panel-h ai-h"><span class="ai-title"></span><div class="panel-actions" id="ai-actions"></div></div>
      <div class="ai-provider" id="ai-provider"></div>
      <div id="ai-log"></div>
      <form id="ai-form">
        <textarea id="ai-input" rows="2" placeholder="Descreva o que criar…"></textarea>
        <div class="ai-form-bar">
          <span class="ai-cursors-ctl" id="ai-cursors-ctl"></span>
          <button type="submit" class="btn primary sm" id="ai-send"></button>
        </div>
      </form>
    </aside>

    <!-- Páginas (Início, Loja, Código, Engines, Comandos, Ajustes) abrem como uma "folha" flutuante -->
    <div id="sheet">
      <div class="sheet-card">
        <div class="sheet-h"><div class="sheet-title" id="sheet-title"></div><button class="icon-btn" id="sheet-close" title="Fechar (Esc)"></button></div>
        <div id="page"></div>
      </div>
    </div>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
