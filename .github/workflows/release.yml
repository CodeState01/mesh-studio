# Publica uma nova versão: atualize "version" no package.json, crie a tag e faça push.
#   npm version patch && git push --follow-tags
# Os apps instalados detectam a Release e se atualizam sozinhos (electron-updater).
name: release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
